# 部署说明（192.168.60.120）：
# - Elasticsearch：已由本机 bid-es 容器（es-ik:8.13.4, :9200）提供，不在此编排
# - PostgreSQL / Milvus / MinIO / Xinference Embedding：外部服务
#   （192.168.61.222:5444 / 192.168.60.121），地址由 backend/.env 配置
# - Langfuse：已由本机 langfuse-main 项目提供（:3000）

services:
  # === 后端 API（FastAPI） ===
  backend:
    build: ./backend
    container_name: bid_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./volumes/backend/temp:/app/temp
      - ./volumes/backend/logs:/app/logs
    restart: unless-stopped

  # === 前端（Vue 3 静态资源 + Nginx 反代） ===
  frontend:
    build: ./frontend
    container_name: bid_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # === Neo4j（知识图谱存储，仅本地/部署机开发；生产可外部化由 .env 指向） ===
  neo4j:
    image: neo4j:5.21.0
    container_name: bid_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser（可选调试）
      - "7687:7687"   # Bolt 协议（应用连接）
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password123}
      NEO4J_PLUGINS: '["apoc"]'                 # 可选：已改用纯 Cypher 去重（reduce），运行时不依赖 APOC
      NEO4J_server_memory_heap_max__size: 1g
    volumes:
      - ./volumes/neo4j/data:/data
      - ./volumes/neo4j/logs:/logs
    restart: unless-stopped
